services:
  - type: web
    name: listik-telegram-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_STATE_PATH
        value: /data/bot-state.pkl
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
